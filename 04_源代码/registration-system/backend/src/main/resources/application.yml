server:
  port: ${APP_PORT:8081}
  address: 127.0.0.1
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:registration}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:registration}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-init-sql: SET SESSION innodb_lock_wait_timeout=10
  jackson:
    time-zone: UTC
  flyway:
    enabled: true
app:
  profile: ${APP_PROFILE:demo}
  fixed-clock: ${APP_FIXED_CLOCK:2026-10-08T02:00:00Z}
  billing-url: ${BILLING_URL:http://127.0.0.1:8092}
  catalog-url: ${CATALOG_URL:http://127.0.0.1:8091}
  mock-token: ${MOCK_TOKEN}
  demo-password: ${DEMO_PASSWORD}
  seed-demo: ${SEED_DEMO:true}
logging:
  level:
    root: INFO
